name: free-grind
options:
  bundleIdPrefix: dev.estopia.free-grind
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Free Grind
      PRODUCT_BUNDLE_IDENTIFIER: dev.estopia.free-grind
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  free-grind_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: free-grind_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: free-grind_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleShortVersionString: 0.5.2
        CFBundleVersion: "0.5.2"
        # App disguise (stealth mode, mirrors the Android activity-alias
        # feature): alternate icon sets the JS side can switch to at runtime
        # via UIApplication.setAlternateIconName (see ios-app-disguise
        # plugin). Names here must match the App Icon asset-catalog set
        # names (AppIcon-Calculator.appiconset etc.) — with
        # ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS enabled below,
        # CFBundleIconFiles only needs that one set name, not individual
        # image filenames. There's no equivalent for the app's *name* —
        # iOS has no supported API to change CFBundleDisplayName at runtime.
        CFBundleIcons:
          CFBundleAlternateIcons:
            Calculator:
              CFBundleIconFiles: [AppIcon-Calculator]
              UIPrerenderedIcon: false
            Notes:
              CFBundleIconFiles: [AppIcon-Notes]
              UIPrerenderedIcon: false
            Weather:
              CFBundleIconFiles: [AppIcon-Weather]
              UIPrerenderedIcon: false
        CFBundleIcons~ipad:
          CFBundleAlternateIcons:
            Calculator:
              CFBundleIconFiles: [AppIcon-Calculator]
              UIPrerenderedIcon: false
            Notes:
              CFBundleIconFiles: [AppIcon-Notes]
              UIPrerenderedIcon: false
            Weather:
              CFBundleIconFiles: [AppIcon-Weather]
              UIPrerenderedIcon: false
    entitlements:
      path: free-grind_iOS/free-grind_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # Bundles the AppIcon-Calculator/-Notes/-Weather asset-catalog icon
        # sets too, not just the primary AppIcon — required for
        # CFBundleAlternateIcons (see info.properties above) to resolve them
        # by set name at runtime.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a