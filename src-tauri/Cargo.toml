[package]
name = "free-grind"
version = "0.5.4"
description = "Free Grind is a Grindr Client"
authors = ["Jay Brammeld <jay@imaoreo.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_grind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# This feature is used for production builds to enable custom protocol support (tauri://).
# It's automatically enabled by the Tauri CLI during "tauri build".
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# custom-protocol is removed from here and moved to [features].
# In the previous definition, it was active even in dev mode, which caused
# the app to load cached or embedded assets instead of connecting to the
# dev server, preventing hot-reloading and updates on mobile/emulators.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "10.3.0"
rand = "0.10.1"
chrono = "0.4.44"
tauri-plugin-fs = "2"
keyring-core = "0.7.2"
rmp-serde = "1.3.1"
serde_bytes = "0.11"
tauri-plugin-geolocation = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = { path = "notification-patched" }
tauri-plugin-http = "2"
futures-util = "0.3"
http = "1"
url = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
wreq = { version = "5.3", features = ["gzip", "json"] }
# Blocking HTTP client for version fetching (non-critical, doesn't affect auth fingerprint)
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false }
tauri-plugin-hotswap = { path = "hotswap-patched" }
rustls = { version = "0.23", features = ["ring"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "0.5.1"
# Use rustls for WebSocket on Windows to avoid SChannel JA3 fingerprint detection by Cloudflare
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Same webview2-com/windows versions wry (our Tauri version's webview backend) already
# pulls in, so the ICoreWebView2 types in lib.rs line up with what's actually loaded.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "0.5.0"
tauri-plugin-android-fs = { version = "=28.2.2", features = ["legacy_storage_permission"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-photos = "0.3"
tauri-plugin-ios-keyboard-fix = { path = "ios-keyboard-fix" }
apple-native-keyring-store = { version = "0.2.3", features = ["protected"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "0.2.3", features = ["protected", "keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "0.2.1"
webkit2gtk = "2"

# boring-sys2 builds BoringSSL from source via CMake. In a dev (debug) profile,
# OPT_LEVEL=0 makes the `cmake` crate pick CMAKE_BUILD_TYPE=Debug, which on MSVC
# defaults to the /MDd debug CRT (needs __imp__CrtDbgReport). Rust always links
# against the release CRT (msvcrt, not msvcrtd), so the two mismatch and the
# linker fails with LNK2019 on __imp__CrtDbgReport. Bumping the opt-level here
# makes cmake-rs pick RelWithDebInfo instead, which uses the matching /MD CRT.
[profile.dev.package.boring-sys2]
opt-level = 1
